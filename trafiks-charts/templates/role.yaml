{{- if .Values.backend.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "trafiks-charts.fullname" . }}-backend
  labels:
    {{- include "trafiks-charts.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "trafiks-charts.fullname" . }}-backend
  labels:
    {{- include "trafiks-charts.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "trafiks-charts.fullname" . }}-backend
subjects:
  - kind: ServiceAccount
    name: {{ include "trafiks-charts.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}


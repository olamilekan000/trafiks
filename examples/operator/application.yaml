---
apiVersion: v1
kind: Secret
metadata:
  name: trafiks-backend-credentials
  namespace: trafiks
type: Opaque
stringData:
  baseURL: "http://localhost:8890"
  # apikey should be created on the trafiks dashboard
  apiKey: "tfk_d215a10b27c56050f6ab6ee094cc4aa27b5b6291ea2e3379dfbd883bc0a2e523"

---
apiVersion: proxy.trafiks.io/v1
kind: TrafiksBackend
metadata:
  name: trafiks-backend-config
  namespace: trafiks
spec:
  secretRef:
    name: trafiks-backend-credentials
    namespace: trafiks

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: trafiks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: trafiks
spec:
  selector:
    app: nginx-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: trafiks
  annotations:
    trafiks.io/proxy-url: "nginx.traffiked.cloud"
    trafiks.io/project-name: "nginx-project"
    trafiks.io/scheme: "http"
spec:
  rules:
    - host: nginx.traffiked.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - nginx.traffiked.cloud
  #     secretName: nginx-tls-secret

---
apiVersion: proxy.trafiks.io/v1
kind: TrafiksProxy
metadata:
  name: nginx-proxy
  namespace: trafiks
spec:
  proxyURL: "nginx.traffiked.cloud"
  projectName: "nginx-project"
  kubernetes:
    namespace: "trafiks"
    serviceName: "nginx-service"

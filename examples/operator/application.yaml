---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-app
  namespace: trafiks
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: trafiks
spec:
  selector:
    app: nginx-app
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: trafiks
  annotations:
    trafiks.io/proxy-url: "nginx.traffiked.cloud" # Must match TrafiksProxy.spec.proxyURL
spec:
  rules:
    - host: nginx.traffiked.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trafiks-trafiks-charts-backend
                port:
                  number: 8889

---
apiVersion: proxy.trafiks.io/v1
kind: TrafiksProxy
metadata:
  name: nginx-proxy
  namespace: trafiks
spec:
  backendRef:
    name: trafiks-backend-config
    namespace: trafiks # Optional, defaults to TrafiksProxy namespace
  proxyURL: "nginx.traffiked.cloud"
  projectName: "nginx-project"
  kubernetes:
    namespace: "trafiks"
    serviceName: "nginx-service"
    servicePortName: "http" # Optional: port name or number (e.g., "http", "8080"). If not specified, uses "http" or first port.
  cache:
    enabled: true
    ttl: 300 # 5 minutes
  httpsRedirect: false
  headers:
    add:
      X-Forwarded-Proto: "https"
      X-Real-IP: "$remote_addr"
    remove:
      - X-Forwarded-For
  queryParams:
    remove:
      - debug

apiVersion: proxy.trafiks.io/v1
kind: TrafiksProxy
metadata:
  name: my-api-proxy
  namespace: default
spec:
  # The proxy domain/URL (without scheme)
  proxyURL: "myapi.example.com"

  # HTTP scheme (http or https)
  scheme: "https"

  # Optional: Project name in Trafiks dashboard
  # If not specified, operator will create or use default project
  projectName: "my-project"

  # Kubernetes-specific configuration
  kubernetes:
    # Namespace where the target service exists
    namespace: "default"

    # Name of the Kubernetes Service to proxy
    serviceName: "my-api-service"

    # Optional: Port name only (e.g., "http", "https")
    # If not specified, operator will use a port named "http" or the first available port
    # servicePortName: "http"

    # Optional: Service selector (for advanced use cases)
    # selector:
    #   app: my-api
    #   version: v1

apiVersion: v1
kind: Service
metadata:
  name: controller-manager-ingress
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: trafiks-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31856
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      nodePort: 32091
      protocol: TCP
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: trafiks-operator

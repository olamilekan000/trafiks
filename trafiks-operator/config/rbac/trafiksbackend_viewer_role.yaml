# This rule is not used by the project trafiks-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to proxy.trafiks.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: trafiks-operator
    app.kubernetes.io/managed-by: kustomize
  name: trafiksbackend-viewer-role
rules:
- apiGroups:
  - proxy.trafiks.io
  resources:
  - trafiksbackends
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - proxy.trafiks.io
  resources:
  - trafiksbackends/status
  verbs:
  - get

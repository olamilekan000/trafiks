# This rule is not used by the project trafiks-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over proxy.trafiks.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: trafiks-operator
    app.kubernetes.io/managed-by: kustomize
  name: trafiksbackend-admin-role
rules:
- apiGroups:
  - proxy.trafiks.io
  resources:
  - trafiksbackends
  verbs:
  - '*'
- apiGroups:
  - proxy.trafiks.io
  resources:
  - trafiksbackends/status
  verbs:
  - get

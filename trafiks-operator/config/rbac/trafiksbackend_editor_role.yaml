# This rule is not used by the project trafiks-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the proxy.trafiks.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: trafiks-operator
    app.kubernetes.io/managed-by: kustomize
  name: trafiksbackend-editor-role
rules:
- apiGroups:
  - proxy.trafiks.io
  resources:
  - trafiksbackends
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - proxy.trafiks.io
  resources:
  - trafiksbackends/status
  verbs:
  - get
